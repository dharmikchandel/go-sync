syntax = "proto3";

package sync;

option go_package = "go-sync/proto;proto";

service FileSyncService {
  rpc UploadFile(stream UploadChunk) returns (UploadStatus);
  rpc SyncEvents(SyncRequest) returns (stream FileEvent);
  rpc DownloadFile(DownloadRequest) returns (stream DownloadChunk);
}

message SyncRequest {
  string user_id = 1;
}

message FileEvent {
  string file_id = 1;
  string filename = 2;
  int32 version = 3;
  string checksum = 4;
  int64 size_bytes = 5;
  string event_type = 6; // CREATED, UPDATED, CONFLICT
}

message UploadChunk {
  string file_name = 1;
  bytes data = 2;
}

message UploadStatus {
  bool success = 1;
  string message = 2;
}

message DownloadRequest {
  string filename = 1;
}

message DownloadChunk {
  bytes data = 1;
}