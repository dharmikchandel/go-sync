name: go-sync

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gosync
      POSTGRES_PASSWORD: gosync
      POSTGRES_DB: gosync
    # No host port: the server reaches Postgres over the compose network, and
    # publishing 5432 clashes with any Postgres already installed locally.
    # Use `make psql` to get a shell.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gosync", "-d", "gosync"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage. Any S3 server works; RustFS is used because
  # MinIO no longer publishes community container images.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: gosync
      RUSTFS_SECRET_KEY: gosync-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    # Host ports bind to localhost only and can be overridden if taken.
    ports:
      - "127.0.0.1:${GOSYNC_S3_PORT:-9000}:9000" # S3 API
      - "127.0.0.1:${GOSYNC_S3_CONSOLE_PORT:-9001}:9001" # web console, handy during demos
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      GOSYNC_POSTGRES_URL: postgres://gosync:gosync@postgres:5432/gosync?sslmode=disable
      GOSYNC_S3_ENDPOINT: s3:9000
      GOSYNC_S3_ACCESS_KEY: gosync
      GOSYNC_S3_SECRET_KEY: gosync-secret
      GOSYNC_REPLICA_ID: server-1
    ports:
      - "127.0.0.1:${GOSYNC_GRPC_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD", "/go-sync", "-server", "localhost:50051", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  s3data:
