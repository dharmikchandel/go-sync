version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: go-sync-postgres
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: go-sync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: go-sync-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: go-sync-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  nats:
    image: nats:2
    container_name: go-sync-nats
    ports:
      - "4222:4222"

  go-sync:
    build: .
    container_name: go-sync-server
    depends_on:
      - postgres
      - redis
      - minio
      - nats
    ports:
      - "50051:50051"
    environment:
      POSTGRES_URL: postgres://postgres:secret@postgres:5432/go-sync?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: minio
      MINIO_PASS: minio123
      NATS_URL: nats://nats:4222

volumes:
  pgdata:
  miniodata:
